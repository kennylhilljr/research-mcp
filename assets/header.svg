<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <radialGradient id="bg-glow" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0f2540"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-glow)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Network graph edges -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <line x1="940" y1="200" x2="820" y2="120"/>
    <line x1="940" y1="200" x2="820" y2="280"/>
    <line x1="940" y1="200" x2="1040" y2="130"/>
    <line x1="940" y1="200" x2="1040" y2="270"/>
    <line x1="940" y1="200" x2="1110" y2="200"/>
    <line x1="940" y1="200" x2="870" y2="200"/>
    <line x1="820" y1="120" x2="1040" y2="130"/>
    <line x1="820" y1="280" x2="1040" y2="270"/>
    <line x1="820" y1="120" x2="870" y2="200"/>
    <line x1="820" y1="280" x2="870" y2="200"/>
    <line x1="1040" y1="130" x2="1110" y2="200"/>
    <line x1="1040" y1="270" x2="1110" y2="200"/>
    <line x1="820" y1="120" x2="760" y2="80" opacity="0.5"/>
    <line x1="820" y1="280" x2="760" y2="320" opacity="0.5"/>
    <line x1="1040" y1="130" x2="1090" y2="70" opacity="0.5"/>
    <line x1="1040" y1="270" x2="1090" y2="340" opacity="0.5"/>
  </g>

  <!-- Outer dim nodes -->
  <g opacity="0.3">
    <circle cx="760" cy="80" r="4" fill="#38bdf8"/>
    <circle cx="760" cy="320" r="4" fill="#38bdf8"/>
    <circle cx="1090" cy="70" r="4" fill="#38bdf8"/>
    <circle cx="1090" cy="340" r="4" fill="#38bdf8"/>
    <circle cx="1150" cy="155" r="3" fill="#2dd4bf"/>
    <circle cx="1150" cy="245" r="3" fill="#2dd4bf"/>
    <circle cx="780" cy="190" r="3" fill="#2dd4bf"/>
  </g>

  <!-- Mid nodes -->
  <g opacity="0.65" filter="url(#node-glow)">
    <circle cx="820" cy="120" r="7" fill="#38bdf8"/>
    <circle cx="820" cy="280" r="7" fill="#38bdf8"/>
    <circle cx="1040" cy="130" r="7" fill="#38bdf8"/>
    <circle cx="1040" cy="270" r="7" fill="#38bdf8"/>
    <circle cx="1110" cy="200" r="8" fill="#2dd4bf"/>
    <circle cx="870" cy="200" r="6" fill="#2dd4bf"/>
  </g>

  <!-- Central hub -->
  <circle cx="940" cy="200" r="22" fill="#0d1117" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>
  <circle cx="940" cy="200" r="14" fill="#38bdf8" opacity="0.2"/>
  <circle cx="940" cy="200" r="7" fill="#38bdf8" filter="url(#node-glow)"/>

  <!-- Eyebrow label -->
  <text
    x="100" y="130"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="13" font-weight="400" letter-spacing="4"
    fill="#38bdf8" opacity="0.7"
  >MCP SERVER</text>

  <!-- Main title -->
  <text
    x="96" y="210"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="64" font-weight="700" letter-spacing="-1"
    fill="#f0f6fc"
  >Research MCP</text>

  <!-- Accent underline -->
  <rect x="96" y="222" width="420" height="3" rx="1.5" fill="#38bdf8" opacity="0.8"/>

  <!-- Tagline -->
  <text
    x="98" y="265"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="18" font-weight="400" letter-spacing="0.3"
    fill="#8b949e"
  >Federated scholarly search for AI agents</text>

  <!-- Feature pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500">
    <rect x="98" y="295" width="134" height="26" rx="13" fill="#1c2d3e" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
    <text x="165" y="312" fill="#38bdf8" text-anchor="middle">cross-source search</text>

    <rect x="244" y="295" width="120" height="26" rx="13" fill="#1c2d3e" stroke="#2dd4bf" stroke-width="1" opacity="0.8"/>
    <text x="304" y="312" fill="#2dd4bf" text-anchor="middle">document cache</text>

    <rect x="376" y="295" width="100" height="26" rx="13" fill="#1c2d3e" stroke="#7dd3fc" stroke-width="1" opacity="0.8"/>
    <text x="426" y="312" fill="#7dd3fc" text-anchor="middle">localhost UI</text>
  </g>

  <!-- Version badge -->
  <text
    x="1180" y="385"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="12" fill="#30363d" text-anchor="end"
  >v2 · Python 3.12 · MCP</text>
</svg>
