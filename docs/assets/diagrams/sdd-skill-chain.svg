<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 1160' width='960' height='1160' font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" role='img' aria-label='SDD skill chain'><title>SDD skill chain</title><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#a8a69e'/></marker></defs><rect width='960' height='1160' fill='#ffffff'/><text x='24' y='40' font-size='17' font-weight='600' fill='#1a1a1a' text-anchor='start'>People decide at the shaded points; agents prepare the rest</text><text x='24' y='63' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Each skill drafts from approved inputs. Optional modes run behind a feature flag.</text><path d='M346 174V229' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M346 202H652' fill='none' stroke='#2f6fd6' stroke-width='1.25' stroke-dasharray='4 4'/><path d='M346 195L353 202L346 209L339 202z' fill='#2f6fd6'/><rect x='652' y='175' width='284' height='54' rx='8' fill='#e6eefb' stroke='#2f6fd6' stroke-width='2'/><text x='672' y='198' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>Intake checkpoint</text><text x='672' y='217' font-size='12.5' fill='#1a1a1a' text-anchor='start'>Product approves the problem framing</text><path d='M346 312V367' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M346 450V505' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M346 478H652' fill='none' stroke='#2f6fd6' stroke-width='1.25' stroke-dasharray='4 4'/><path d='M346 471L353 478L346 485L339 478z' fill='#2f6fd6'/><rect x='652' y='451' width='284' height='54' rx='8' fill='#e6eefb' stroke='#2f6fd6' stroke-width='2'/><text x='672' y='474' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>Gate 1</text><text x='672' y='493' font-size='12.5' fill='#1a1a1a' text-anchor='start'>Product approves the PRDs</text><path d='M346 570V625' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M346 598H652' fill='none' stroke='#2f6fd6' stroke-width='1.25' stroke-dasharray='4 4'/><path d='M346 591L353 598L346 605L339 598z' fill='#2f6fd6'/><rect x='652' y='571' width='284' height='54' rx='8' fill='#e6eefb' stroke='#2f6fd6' stroke-width='2'/><text x='672' y='594' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>Gate 2</text><text x='672' y='613' font-size='12.5' fill='#1a1a1a' text-anchor='start'>Engineering approves the HLD and ADRs</text><path d='M346 708V763' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M346 736H652' fill='none' stroke='#2f6fd6' stroke-width='1.25' stroke-dasharray='4 4'/><path d='M346 729L353 736L346 743L339 736z' fill='#2f6fd6'/><rect x='652' y='709' width='284' height='54' rx='8' fill='#e6eefb' stroke='#2f6fd6' stroke-width='2'/><text x='672' y='732' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>Gate 3</text><text x='672' y='751' font-size='12.5' fill='#1a1a1a' text-anchor='start'>Owners approve the LLD and tests</text><path d='M346 828V883' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M346 948V1003' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><path d='M652 119H598' fill='none' stroke='#2f6fd6' stroke-width='1.25' stroke-dasharray='4 4' marker-end='url(#arrow)'/><rect x='652' y='92' width='284' height='54' rx='8' fill='#e6eefb' stroke='#2f6fd6' stroke-width='2'/><text x='672' y='115' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>Product input</text><text x='672' y='134' font-size='12.5' fill='#1a1a1a' text-anchor='start'>Answers the 12 seed questions</text><path d='M596 1045H652' fill='none' stroke='#a8a69e' stroke-width='1.25' stroke-dasharray='4 4'/><rect x='652' y='1018' width='284' height='54' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25' stroke-dasharray='5 4'/><text x='672' y='1041' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>CI on every pull request</text><text x='672' y='1060' font-size='12.5' fill='#5f5e5a' text-anchor='start'>spec-lint and trace-check: structural links</text><path d='M346 1086V1116H48V271H94' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><text x='64' y='1138' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Disagreement found: the owner names the first artifact that lost intent; it is corrected, then its dependents</text><rect x='96' y='92' width='500' height='82' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='116' y='118' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>sdd-intake</text><text x='116' y='139' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Interviews Product with the 12 seed</text><text x='116' y='157' font-size='12.5' fill='#5f5e5a' text-anchor='start'>questions; writes PRD Section 1 and its scope</text><rect x='96' y='230' width='500' height='82' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='116' y='256' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>sdd-spec</text><text x='116' y='277' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Drafts stories, requirements and EARS</text><text x='116' y='295' font-size='12.5' fill='#5f5e5a' text-anchor='start'>criteria with stable IDs, as options to select</text><rect x='96' y='368' width='500' height='82' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='116' y='394' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>sdd-clarify</text><text x='116' y='415' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Finds gaps and conflicts; optional blind</text><text x='116' y='433' font-size='12.5' fill='#5f5e5a' text-anchor='start'>divergence probe; asks only what is missing</text><rect x='96' y='506' width='500' height='64' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='116' y='532' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>sdd-hld</text><text x='116' y='553' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Drafts the SPEC and ADR options with tradeoffs</text><rect x='96' y='626' width='500' height='82' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='116' y='652' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>sdd-lld &lt;component&gt;</text><text x='116' y='673' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Drafts one LLD: contracts, schema, authZ</text><text x='116' y='691' font-size='12.5' fill='#5f5e5a' text-anchor='start'>and the test strategy with planned evidence</text><rect x='96' y='764' width='500' height='64' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='116' y='790' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>sdd-tasks &lt;component&gt;</text><text x='116' y='811' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Small, dependency-ordered tasks, each traced to criterion IDs</text><rect x='96' y='884' width='500' height='64' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='116' y='910' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>sdd-implement &lt;milestone&gt;</text><text x='116' y='931' font-size='12.5' fill='#5f5e5a' text-anchor='start'>One task at a time, tests first; @spec on each test and entry point</text><rect x='96' y='1004' width='500' height='82' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='116' y='1030' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>sdd-verify</text><text x='116' y='1051' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Structural trace checks and evidence states;</text><text x='116' y='1069' font-size='12.5' fill='#5f5e5a' text-anchor='start'>optional blind differential; reports disagreements</text></svg>
