s traced to criterion IDs</text><text x='188' y='689' font-size='12.5' fill='#5f5e5a' text-anchor='start'>docs/build/Mn-plan-vN.md</text><rect x='570.361' y='637' width='31.6394' height='24' rx='12' fill='#e6eefb' stroke='#2f6fd6' stroke-width='1.25'/><text x='586.18' y='653.5' font-size='12.5' font-weight='600' fill='#1a1a1a' text-anchor='middle'>A</text><text x='150' y='668' font-size='13' fill='#1a1a1a' text-anchor='end'>M1-3</text><path d='M393 702V735' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='168' y='736' width='450' height='78' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='188' y='762' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>Code and tests</text><text x='188' y='782' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Tests and entry points cite criteria</text><text x='188' y='801' font-size='12.5' fill='#5f5e5a' text-anchor='start'>src/, test/</text><rect x='570.361' y='749' width='31.6394' height='24' rx='12' fill='#e6eefb' stroke='#2f6fd6' stroke-width='1.25'/><text x='586.18' y='765.5' font-size='12.5' font-weight='600' fill='#1a1a1a' text-anchor='middle'>A</text><text x='150' y='780' font-size='13' fill='#1a1a1a' text-anchor='end'>@spec TECH-2</text><path d='M393 814V847' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='407' y='821' width='91.4431' height='20' rx='10' fill='#e6eefb' stroke='#2f6fd6' stroke-width='1.25'/><text x='452.722' y='835' font-size='11.5' font-weight='600' fill='#2f6fd6' text-anchor='middle'>Code review</text><rect x='168' y='848' width='450' height='78' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='188' y='874' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>Handoff and evidence</text><text x='188' y='894' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Test results, review, derived evidence</text><text x='188' y='913' font-size='12.5' fill='#5f5e5a' text-anchor='start'>docs/build/, docs/trace/</text><rect x='570.361' y='861' width='31.6394' height='24' rx='12' fill='#e6eefb' stroke='#2f6fd6' stroke-width='1.25'/><text x='586.18' y='877.5' font-size='12.5' font-weight='600' fill='#1a1a1a' text-anchor='middle'>A</text><text x='150' y='892' font-size='13' fill='#1a1a1a' text-anchor='end'>passing</text><rect x='668' y='176' width='268' height='414' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25' stroke-dasharray='5 4'/><text x='688' y='204' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>Organizational scope (scope map)</text><rect x='688' y='220' width='228' height='48' rx='6' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='702' y='249' font-size='13.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>L0</text><text x='736' y='240' font-size='12' fill='#5f5e5a' text-anchor='start'>Enterprise</text><text x='736' y='256' font-size='12' fill='#5f5e5a' text-anchor='start'>strategy and imperatives</text><path d='M802 268V281' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='688' y='282' width='228' height='48' rx='6' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='702' y='311' font-size='13.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>L1</text><text x='736' y='302' font-size='12' fill='#5f5e5a' text-anchor='start'>Domain (Access</text><text x='736' y='318' font-size='12' fill='#5f5e5a' text-anchor='start'>Management)</text><path d='M802 330V343' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='688' y='344' width='228' height='40' rx='6' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='702' y='369' font-size='13.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>L2</text><text x='736' y='368' font-size='12' fill='#5f5e5a' text-anchor='start'>Solution or capability</text><path d='M802 384V397' fill='none' stroke='#a8a69e' stroke-width='1.25' marker-end='url(#arrow)'/><rect x='688' y='398' width='228' height='40' rx='6' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25'/><text x='702' y='423' font-size='13.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>L3</text><text x='736' y='422' font-size='12' fill='#5f5e5a' text-anchor='start'>Business Application</text><text x='688' y='456' font-size='12' fill='#5f5e5a' text-anchor='start'>Organizational units, not document</text><text x='688' y='474' font-size='12' fill='#5f5e5a' text-anchor='start'>stages. Gates 1 to 3 do not map to</text><text x='688' y='492' font-size='12' fill='#5f5e5a' text-anchor='start'>L1 to L3. Artifacts record</text><text x='688' y='510' font-size='12' fill='#5f5e5a' text-anchor='start'>scope_level and scope_name.</text><rect x='668' y='624' width='268' height='302' rx='8' fill='#ffffff' stroke='#a8a69e' stroke-width='1.25' stroke-dasharray='5 4'/><text x='688' y='652' font-size='14.5' font-weight='600' fill='#1a1a1a' text-anchor='start'>Beside the chain</text><text x='688' y='676' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Research (A): findings that inform</text><text x='688' y='695' font-size='12.5' fill='#5f5e5a' text-anchor='start'>the specification and designs,</text><text x='688' y='714' font-size='12.5' fill='#5f5e5a' text-anchor='start'>never decisions. docs/research/</text><text x='688' y='743' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Operations: runbooks and</text><text x='688' y='762' font-size='12.5' fill='#5f5e5a' text-anchor='start'>postmortems. docs/runbooks/,</text><text x='688' y='781' font-size='12.5' fill='#5f5e5a' text-anchor='start'>docs/postmortems/</text><text x='688' y='810' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Machinery: .claude/ skills</text><text x='688' y='829' font-size='12.5' fill='#5f5e5a' text-anchor='start'>and hooks; tools/ spec-lint</text><text x='688' y='848' font-size='12.5' fill='#5f5e5a' text-anchor='start'>and trace-check; CI on</text><text x='688' y='867' font-size='12.5' fill='#5f5e5a' text-anchor='start'>every pull request</text><text x='24' y='962' font-size='12.5' fill='#5f5e5a' text-anchor='start'>Checks verify structural links from approved criteria to cited tests and code entry points. They do not prove meaning, so review remains required.</text></svg>
